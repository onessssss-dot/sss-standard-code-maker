spring:
  application:
    name: ai-code-maker-backend
    # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/code_maker
    username: root
    password: 123456
  profiles:
    active: local
    #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 0
  session:
    store-type: redis
    # session 30 天过期
    timeout: 86400
springdoc:
  openapi:
    group-configs:
      - group: 'default'
        packages-to-scan: com.example.demouser.controller
server:
  port: 8124
  servlet:
    context-path: /api
    #cookie 30天过期
    session:
      cookie:
        max-age: 86400

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
logging:
  level:
    com.example.demo: debug
    com.baomidou.mybatisplus: debug